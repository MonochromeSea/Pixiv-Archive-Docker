<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixiv Archive</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('pa-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
                if (localStorage.getItem('pa-safe') === '1') {
                    document.documentElement.classList.add('safe-mode');
                }
            } catch (e) {}
        })();
    </script>
    <script src="/static/js/pa_token.js"></script>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand"><a href="/" class="brand-text">Pixiv Archive</a></div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索标题 / 作者 / 标签 / Pixiv ID..."
               autocomplete="off">
        <button onclick="doSearch()">搜索</button>
    </div>
    <select id="sortSelect" onchange="onSortChange()">
        <option value="id">添加时间</option>
        <option value="pixiv_id">Pixiv ID</option>
        <option value="title">标题</option>
        <option value="create_date">创作时间</option>
    </select>
    <select id="orderSelect" onchange="onSortChange()">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
    </select>
    <button class="top-btn" id="btnR18" onclick="cycleR18()" title="切换 R18 显示模式">R18：全部</button>
    <button class="top-btn" id="btnDeleted" onclick="toggleDeletedFilter()" title="只看已删除作品">已删除</button>
    <button class="top-btn" id="btnAuthors" onclick="switchView('authors')">作者列表</button>
    <button class="top-btn" id="btnTags" onclick="switchView('tags')">标签列表</button>
    <button class="top-btn" id="btnFavorites" onclick="switchView('favorites')">收藏夹</button>
    <button class="top-btn" onclick="openSettings()">⚙ 设置</button>
    <button class="top-btn" id="btnTheme" onclick="toggleTheme()" title="切换主题">☀️</button>
    <span class="safe-badge" id="safeBadge" style="display:none;">🔒 安全模式</span>
    <span class="stats" id="stats"></span>
</header>

<main>
    <!-- Gallery view -->
    <div class="view active" id="viewGallery">
        <div class="view-header" id="galleryHeader" style="display:none;">
            <span id="galleryHeaderText"></span>
            <a class="filter-clear" onclick="clearFilter()" style="display:none;" id="filterClear">✕ 清除筛选</a>
        </div>
        <div id="wall" class="wall"></div>
        <div id="loading" class="loading" style="display:none;">加载中...</div>
        <div id="empty" class="empty-state" style="display:none;">没有找到作品。<br>请先扫描图片目录，然后同步元数据。</div>
        <div class="pagination" id="pagination" style="display:none;"></div>
    </div>

    <!-- Authors view -->
    <div class="view" id="viewAuthors">
        <div class="view-header">作者列表</div>
        <div class="view-search">
            <input type="text" id="authorSearchInput" placeholder="搜索作者..." oninput="loadAuthorsView()">
        </div>
        <div id="authorList" class="author-list"></div>
    </div>

    <!-- Tags view -->
    <div class="view" id="viewTags">
        <div class="view-header">标签列表</div>
        <div class="view-search">
            <input type="text" id="tagSearchInput" placeholder="搜索标签..." oninput="loadTagsView()">
        </div>
        <div id="tagCloud" class="tag-cloud"></div>
    </div>

    <!-- Favorites view -->
    <div class="view" id="viewFavorites">
        <div class="view-header">
            <span>收藏夹</span>
            <button class="top-btn" onclick="showCreateFavorite()">＋ 新建收藏夹</button>
        </div>
        <div id="favoriteGrid" class="favorites-grid"></div>
    </div>
</main>

<!-- Floating action panel -->
<div class="fab-panel">
    <button class="fab secondary" id="btnSync" onclick="startJob('sync')">同步元数据</button>
    <button class="fab" id="btnScan" onclick="startJob('scan')">扫描图片</button>
</div>

<!-- Batch action bar (appears when images are selected) -->
<div class="batch-bar" id="batchBar" style="display:none;">
    <span class="batch-count" id="batchCount">已选 0 件</span>
    <button class="batch-btn" id="selectAllBtn" onclick="selectAll()">全选</button>
    <button class="batch-btn" onclick="batchFav()">收藏</button>
    <button class="batch-btn danger" onclick="batchDelete()">删除</button>
    <button class="batch-btn" onclick="clearSelection()">取消选择</button>
</div>

<!-- Job progress window (bottom-right, close = stop) -->
<div class="job-window hidden" id="jobWindow">
    <div class="job-head">
        <span class="job-title" id="jobTitle">任务</span>
        <button class="job-close" id="jobClose" onclick="closeJobWindow()" title="停止并关闭">✕</button>
    </div>
    <div class="job-body" id="jobBody">
        <div class="job-message" id="jobPhase">准备中…</div>
        <div class="job-bar" id="jobBar"><div class="job-bar-fill" id="jobBarFill"></div></div>
        <div class="job-meta" id="jobPct"></div>
    </div>
    <div class="job-result" id="jobResult" style="display:none;"></div>
    <div class="job-error" id="jobError" style="display:none;"></div>
</div>

<!-- Delete confirm overlay -->
<div id="deleteConfirmOverlay" class="settings-overlay hidden" onclick="if(event.target===this)closeDeleteConfirm()">
    <div class="settings-panel">
        <h3 id="delTitle">确认删除</h3>
        <div id="delMsg" class="settings-field" style="font-size:14px;"></div>
        <div class="settings-field">
            <label class="fav-check">
                <input type="checkbox" id="delFilesCheck"> 同时删除本地源文件
            </label>
        </div>
        <div class="settings-actions">
            <button onclick="confirmDelete()" class="btn-primary">确认删除</button>
            <button onclick="closeDeleteConfirm()">取消</button>
        </div>
        <div id="delMsgResult" class="settings-msg" style="display:none;"></div>
    </div>
</div>

<!-- Viewer overlay (left info / right image) -->
<div class="viewer-overlay hidden" id="viewerOverlay">
    <div class="viewer-left">
        <button class="viewer-close" onclick="hideViewer()">← 返回</button>
        <div class="v-title" id="vTitle"></div>
        <div class="v-author" id="vAuthor"></div>
        <div class="v-tags" id="vTags"></div>
        <div class="v-fav" id="vFav">
            <div class="v-fav-label">所在收藏夹：</div>
            <div class="v-fav-tags" id="vFavTags"></div>
        </div>
        <div class="v-desc" id="vDesc" style="display:none;"></div>
        <div class="v-meta" id="vMeta"></div>
        <div class="v-actions">
            <button class="v-fav-btn" id="vFavBtn" onclick="openFavSelect(window._viewerArtworkId)">☆ 收藏</button>
            <button class="v-folder-btn" onclick="openInFolder()" title="在文件夹中打开">📁</button>
            <button class="v-delete" onclick="deleteCurrent()">删除作品</button>
        </div>
    </div>
    <div class="viewer-right">
        <button class="v-art-btn v-art-prev" id="vPrevArt" onclick="viewerArtworkNav(-1)" title="上一个作品">‹</button>
        <div class="v-loading" id="vLoading" style="display:none;">加载中...</div>
        <img id="vMainImage" alt="" style="display:none;">
        <button class="v-art-btn v-art-next" id="vNextArt" onclick="viewerArtworkNav(1)" title="下一个作品">›</button>
        <div class="v-nav" id="vNav" style="display:none;">
            <button id="vPrev" class="v-page-btn" onclick="viewerNav(-1)" title="上一页">◀</button>
            <span class="v-page" id="vPageIndicator"></span>
            <button id="vNext" class="v-page-btn" onclick="viewerNav(1)" title="下一页">▶</button>
        </div>
    </div>
</div>

<!-- Favorite selector overlay -->
<div id="favSelectOverlay" class="settings-overlay hidden" onclick="if(event.target===this)closeFavSelect()">
    <div class="settings-panel fav-select-panel">
        <h3>选择收藏夹</h3>
        <div id="favSelectList" class="fav-select-list"></div>
        <div class="settings-field">
            <label for="favNewName">新建收藏夹（可选）</label>
            <input type="text" id="favNewName" placeholder="输入新收藏夹名称">
        </div>
        <div class="settings-actions">
            <button onclick="confirmFavSelect()" class="btn-primary">确认收藏</button>
            <button onclick="closeFavSelect()">取消</button>
        </div>
        <div id="favSelectMsg" class="settings-msg" style="display:none;"></div>
    </div>
</div>

<!-- Settings overlay -->
<div id="settingsOverlay" class="settings-overlay hidden" onclick="if(event.target===this)closeSettings()">
    <div class="settings-panel">
        <div class="settings-tabs">
            <button type="button" class="settings-tab active" id="tabBasic" onclick="switchSettingsTab('basic')">基础设置</button>
            <button type="button" class="settings-tab" id="tabNetwork" onclick="switchSettingsTab('network')">网络设置</button>
            <a class="settings-github" href="https://github.com/Tumber-ZM/Pixiv-Archive" target="_blank" rel="noopener noreferrer" title="GitHub 仓库">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
            </a>
        </div>
        <div class="settings-section" id="secBasic">
            <div class="settings-field">
                <label for="settingToken">Pixiv Refresh Token</label>
                <input type="password" id="settingToken" placeholder="输入 refresh token">
                <span class="field-hint" id="tokenHint"></span>
            </div>
            <div class="settings-field">
                <label for="settingDir">本地图片目录</label>
                <input type="text" id="settingDir" placeholder="例如 D:\Pixiv">
                <span class="field-hint" id="dirHint"></span>
            </div>
            <div class="settings-field">
                <label for="settingPort">服务器端口</label>
                <input type="text" id="settingPort" placeholder="6814">
                <span class="field-hint" id="portHint"></span>
            </div>
            <div class="settings-field">
                <label for="settingAccessToken">访问令牌（局域网）</label>
                <input type="text" id="settingAccessToken" placeholder="留空则自动生成">
                <span class="field-hint" id="tokenHint2"></span>
            </div>
            <div class="settings-field">
                <label class="fav-check">
                    <input type="checkbox" id="settingSafeMode" onchange="setSafeMode(this.checked)">
                    安全模式（模糊所有图片）
                </label>
                <span class="field-hint">开启后所有图片将模糊显示，适合演示 / 屏幕共享时保护内容。</span>
            </div>
            <div class="settings-field" id="openExternalField" style="display:none;">
                <button onclick="openExternalBrowser()">↗ 在外部浏览器中打开</button>
                <span class="field-hint">在系统浏览器中打开当前应用（桌面窗口模式下可用）。</span>
            </div>
        </div>
        <div class="settings-section" id="secNetwork" style="display:none;">
            <div class="settings-field">
                <label for="settingMode">连接方式</label>
                <select id="settingMode">
                    <option value="auto">自动（直连优先，失败回退代理）</option>
                    <option value="direct">直连（内置绕过 DNS/SNI）</option>
                    <option value="proxy">Clash 代理</option>
                </select>
                <span class="field-hint" id="modeHint"></span>
            </div>
            <div class="settings-field">
                <label for="settingProxy">代理地址（代理模式使用）</label>
                <input type="text" id="settingProxy" placeholder="http://127.0.0.1:7890">
                <span class="field-hint" id="proxyHint"></span>
            </div>
            <div class="settings-field">
                <label>直连 IP 管理</label>
                <button onclick="refreshDirectIps()">🔄 刷新直连 IP（DoH 查询）</button>
                <span class="field-hint" id="refreshIpHint"></span>
            </div>
        </div>
        <div class="settings-actions">
            <button onclick="saveSettings()" class="btn-primary">保存</button>
            <button onclick="closeSettings()">取消</button>
        </div>
        <div id="settingsMsg" class="settings-msg" style="display:none;"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
"use strict";

// ===== State =====
let currentView = 'gallery';
let currentPage = 1;
let currentTotalPages = 1;
let currentTotal = 0;
let currentFilter = { type: null, value: '' };
let currentSearch = '';
let _searchTimer = null;
let _viewer = { data: null, idx: 0 };
let _navIds = [];
let _navIndex = -1;
let _navCtx = { type: 'all', q: '', tag: '', author: '', favoriteId: 0, sort: 'id', order: 'desc', page: 1 };
let _authorWorksIds = {};
let _favSelectArtworkIds = [];
let _favSelectCurrentIds = new Set();
let _favCache = [];
let _selectedIds = new Set();

// ===== Elements =====
const $ = id => document.getElementById(id);

// ===== View switching =====
function switchView(view) {
    currentView = view;
    ['viewGallery', 'viewAuthors', 'viewTags', 'viewFavorites'].forEach(v => $(v).classList.toggle('active', v === 'view' + view[0].toUpperCase() + view.slice(1)));
    $('btnAuthors').classList.toggle('active', view === 'authors');
    $('btnTags').classList.toggle('active', view === 'tags');
    $('btnFavorites').classList.toggle('active', view === 'favorites');
    if (view === 'gallery' && $('wall').children.length === 0 && currentTotal === 0) {
        loadGallery();
    } else if (view === 'authors' && $('authorList').children.length === 0) {
        loadAuthorsView();
    } else if (view === 'tags' && $('tagCloud').children.length === 0) {
        loadTagsView();
    } else if (view === 'favorites' && $('favoriteGrid').children.length === 0) {
        loadFavoritesView();
    }
}

// ===== Gallery =====
function onSortChange() {
    if (currentView === 'gallery') loadGallery(1);
}

function doSearch() {
    const q = $('searchInput').value.trim();
    if (q === currentSearch) return;
    currentSearch = q;
    if (currentView !== 'gallery') switchView('gallery');
    if (!q) { loadGallery(1); return; }
    loadGallery(1);
}

function setFilter(type, value, label) {
    currentFilter = { type, value };
    $('filterClear').style.display = 'inline-block';
    $('galleryHeaderText').textContent = label;
    $('galleryHeader').style.display = 'flex';
    currentSearch = '';
    $('searchInput').value = '';
}

function clearFilter() {
    currentFilter = { type: null, value: '' };
    currentSearch = '';
    $('searchInput').value = '';
    $('filterClear').style.display = 'none';
    $('galleryHeader').style.display = 'none';
    loadGallery(1);
}

async function loadGallery(page = 1) {
    if (currentView !== 'gallery') switchView('gallery');
    currentPage = page;
    $('loading').style.display = 'block';
    $('empty').style.display = 'none';

    const sort = $('sortSelect').value;
    const order = $('orderSelect').value;

    _navCtx = { type: 'all', q: currentSearch, tag: '', author: '', favoriteId: 0, sort, order, page };
    if (currentFilter.type === 'tag') _navCtx.tag = currentFilter.value;
    else if (currentFilter.type === 'author') _navCtx.author = currentFilter.value;
    else if (currentFilter.type === 'favorite') _navCtx.favoriteId = currentFilter.value;
    if (currentSearch) {
        _navCtx.type = 'search';
    } else if (currentFilter.type === 'tag') {
        _navCtx.type = 'tag';
    } else if (currentFilter.type === 'author') {
        _navCtx.type = 'author';
    } else if (currentFilter.type === 'favorite') {
        _navCtx.type = 'favorite';
    }

    let url = buildGalleryUrl(page, _navCtx);

    try {
        const resp = await fetch(url);
        const data = await resp.json();
        renderGallery(data);
    } catch (e) {
        $('loading').style.display = 'none';
        $('empty').style.display = 'block';
        $('empty').textContent = '加载失败：' + e.message;
    }
}

function buildGalleryUrl(page, ctx) {
    let url;
    if (ctx.type === 'search') {
        url = `/api/search?q=${encodeURIComponent(ctx.q)}&page=${page}&per_page=100`;
        if (ctx.tag) url += `&tag=${encodeURIComponent(ctx.tag)}`;
        if (ctx.author) url += `&author=${encodeURIComponent(ctx.author)}`;
        if (ctx.favoriteId) url += `&favorite_id=${ctx.favoriteId}`;
    } else {
        url = `/api/artworks?page=${page}&sort=${ctx.sort}&order=${ctx.order}&per_page=100`;
        if (ctx.type === 'tag') url += `&tag=${encodeURIComponent(ctx.tag)}`;
        else if (ctx.type === 'author') url += `&author=${encodeURIComponent(ctx.author)}`;
        else if (ctx.type === 'favorite') url += `&favorite_id=${ctx.favoriteId}`;
    }
    const r = r18Param();
    if (r) url += '&r18=' + r;
    if (deletedFilter) url += '&status=deleted';
    return url;
}

function renderGallery(data) {
    $('loading').style.display = 'none';
    currentTotal = data.total;
    currentTotalPages = data.total_pages;
    $('stats').textContent = `共 ${data.total} 件`;

    const wall = $('wall');
    wall.innerHTML = '';

    if (!data.artworks.length) {
        $('empty').style.display = 'block';
        $('empty').textContent = currentSearch ? '没有找到匹配的作品。' : (currentFilter.value ? '该筛选下没有作品。' : '没有找到作品。\n请先扫描图片目录，然后同步元数据。');
        $('pagination').style.display = 'none';
        return;
    }

    const frag = document.createDocumentFragment();
    _navIds = data.artworks.map(a => a.id);
    data.artworks.forEach((a, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.animationDelay = Math.min(idx * 5, 100) + 'ms';
        tile.dataset.id = a.id;
        tile.dataset.title = a.title || `Pixiv ID: ${a.pixiv_id}`;
        tile.dataset.author = a.author_name || '';
        tile.dataset.pages = a.page_count;
        tile.dataset.status = a.pixiv_status || 'active';
        tile.dataset.pid = a.pixiv_id;
        tile.onclick = () => { _navIndex = idx; showViewer(a.id); };

        let badges = '';
        if (a.page_count > 1) badges += `<span>${a.page_count}P</span>`;
        if (a.is_r18) badges += `<span class="r18">R18</span>`;
        if (a.pixiv_status === 'deleted') badges += `<span class="deleted">已删除</span>`;
        if (a.sync_error) badges += `<span class="sync-err">同步失败</span>`;

        const title = (a.title || `Pixiv ID: ${a.pixiv_id}`);
        const favCls = a.is_favorited ? ' faved' : '';
        const selected = _selectedIds.has(a.id);

        tile.innerHTML = `
            ${a.thumb_path ? `<img src="/thumbnails/${a.pixiv_id}.jpg" alt="" loading="lazy">` : ''}
            <span class="tile-check${selected ? ' checked' : ''}" onclick="event.stopPropagation();">
                <input type="checkbox" class="tile-checkbox" ${selected ? 'checked' : ''} onchange="toggleSelect(${a.id}, this)">
            </span>
            <div class="tile-badges">${badges}</div>
            <div class="tile-title">${escapeHtml(title)}</div>
            <div class="tile-actions">
                <button class="tile-action-btn${favCls}" onclick="event.stopPropagation();event.preventDefault();openFavSelect(${a.id})" title="${a.is_favorited ? '已收藏（点击管理）' : '收藏'}">${a.is_favorited ? '★' : '☆'}</button>
                <button class="tile-action-btn del" onclick="event.stopPropagation();event.preventDefault();deleteArtworkFromTile(${a.id}, '${escapeAttr(title)}')" title="删除">🗑</button>
            </div>`;

        frag.appendChild(tile);
    });
    wall.appendChild(frag);

    renderPagination(data);
}

function toggleSelect(artworkId, checkbox) {
    const tile = checkbox.closest('.tile');
    const check = checkbox.closest('.tile-check');
    if (checkbox.checked) {
        _selectedIds.add(artworkId);
        if (tile) tile.classList.add('selected');
        if (check) check.classList.add('checked');
    } else {
        _selectedIds.delete(artworkId);
        if (tile) tile.classList.remove('selected');
        if (check) check.classList.remove('checked');
    }
    updateBatchBar();
}

function clearSelection() {
    _selectedIds.clear();
    document.querySelectorAll('.tile-checkbox').forEach(cb => cb.checked = false);
    document.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
    document.querySelectorAll('.tile-check.checked').forEach(c => c.classList.remove('checked'));
    updateBatchBar();
}

function selectAll() {
    const tiles = document.querySelectorAll('#wall .tile[data-id]');
    if (!tiles.length) return;
    const ids = Array.from(tiles).map(t => parseInt(t.dataset.id, 10));
    const allSelected = ids.every(id => _selectedIds.has(id));

    if (allSelected) {
        ids.forEach(id => _selectedIds.delete(id));
        tiles.forEach(t => {
            t.classList.remove('selected');
            const cb = t.querySelector('.tile-checkbox');
            if (cb) cb.checked = false;
            const check = t.querySelector('.tile-check');
            if (check) check.classList.remove('checked');
        });
    } else {
        ids.forEach(id => _selectedIds.add(id));
        tiles.forEach(t => {
            t.classList.add('selected');
            const cb = t.querySelector('.tile-checkbox');
            if (cb) cb.checked = true;
            const check = t.querySelector('.tile-check');
            if (check) check.classList.add('checked');
        });
    }
    updateBatchBar();
}

function updateBatchBar() {
    const bar = $('batchBar');
    const count = _selectedIds.size;
    if (count > 0) {
        bar.style.display = 'flex';
        $('batchCount').textContent = `已选 ${count} 件`;
    } else {
        bar.style.display = 'none';
    }
    const btn = $('selectAllBtn');
    if (btn) {
        const tiles = document.querySelectorAll('#wall .tile[data-id]');
        const allSelected = tiles.length > 0 && Array.from(tiles).every(t => _selectedIds.has(parseInt(t.dataset.id, 10)));
        btn.textContent = allSelected ? '取消全选' : '全选';
    }
}

// ===== Tags view (word cloud) =====
async function loadTagsView() {
    const cloud = $('tagCloud');
    const q = $('tagSearchInput') ? $('tagSearchInput').value.trim() : '';
    cloud.innerHTML = '<div class="loading">加载中...</div>';
    try {
        let url = '/api/tags';
        if (q) url += '?q=' + encodeURIComponent(q);
        const resp = await fetch(url);
        const tags = await resp.json();
        cloud.innerHTML = '';
        if (!tags.length) { cloud.innerHTML = '<div class="empty-state">暂无标签</div>'; return; }

        const maxCount = Math.max(...tags.map(t => t.artwork_count || 0), 1);
        const frag = document.createDocumentFragment();
        tags.forEach(t => {
            const a = document.createElement('a');
            const fs = tagFontSize(t.artwork_count || 0, maxCount);
            a.style.fontSize = fs + 'px';
            a.style.fontWeight = t.artwork_count >= maxCount ? 700 : 400;
            a.title = `${t.name} (${t.artwork_count})`;
            a.innerHTML = escapeHtml(t.name) + `<span class="tag-count">${t.artwork_count}</span>`;
            a.onclick = () => filterByTag(t.name);
            frag.appendChild(a);
        });
        cloud.appendChild(frag);
    } catch (e) {
        cloud.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

function tagFontSize(count, max) {
    const min = 13, maxF = 38;
    if (max <= 1) return maxF;
    return Math.round(min + (maxF - min) * Math.sqrt(count / max));
}

function filterByTag(name) {
    setFilter('tag', name, `#${name}`);

}

// ===== Favorite select dialog =====
async function openFavSelect(ids) {
    const idList = Array.isArray(ids) ? ids : [ids];
    _favSelectArtworkIds = idList;
    _favSelectCurrentIds = new Set();
    $('favSelectOverlay').classList.remove('hidden');
    $('favSelectMsg').style.display = 'none';
    $('favNewName').value = '';
    const list = $('favSelectList');
    list.innerHTML = '<div class="loading">加载中...</div>';
    try {
        const favsResp = await fetch('/api/favorites');
        const favorites = await favsResp.json();
        _favCache = favorites;

        // Collect which favorites currently contain ANY of the selected artworks
        for (const id of idList) {
            try {
                const r = await fetch(`/api/artworks/${id}`);
                const d = await r.json();
                (d.favorites || []).forEach(f => _favSelectCurrentIds.add(f.id));
            } catch (e) {}
        }

        list.innerHTML = '';
        if (!favorites.length) {
            list.innerHTML = '<div class="fav-empty">还没有收藏夹，可在下方新建</div>';
            return;
        }
        favorites.forEach(f => {
            const label = document.createElement('label');
            label.className = 'fav-check';
            label.innerHTML = `<input type="checkbox" value="${f.id}" ${_favSelectCurrentIds.has(f.id) ? 'checked' : ''}> ${escapeHtml(f.name)} <span class="fav-count">${f.artwork_count}</span>`;
            list.appendChild(label);
        });
    } catch (e) {
        list.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

function closeFavSelect() {
    $('favSelectOverlay').classList.add('hidden');
    _favSelectArtworkIds = [];
    _favSelectCurrentIds = new Set();
}

async function confirmFavSelect() {
    if (!_favSelectArtworkIds.length) return;
    const msg = $('favSelectMsg');
    const ids = _favSelectArtworkIds.slice();

    // All favorite ids in the list
    const allFavIds = Array.from($('favSelectList').querySelectorAll('input[type="checkbox"]')).map(c => parseInt(c.value));
    // Checked favorite ids
    const checked = Array.from($('favSelectList').querySelectorAll('input[type="checkbox"]:checked')).map(c => parseInt(c.value));

    let newName = $('favNewName').value.trim();
    if (newName) {
        const resp = await fetch('/api/favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName })
        });
        const data = await resp.json();
        if (data.error) { msg.style.display = 'block'; msg.textContent = '新建失败：' + data.error; msg.style.color = '#e94560'; return; }
        checked.push(data.id);
    }

    // Determine add vs remove
    const toAdd = checked.filter(fid => !_favSelectCurrentIds.has(fid));
    const toRemove = allFavIds.filter(fid => _favSelectCurrentIds.has(fid) && !checked.includes(fid));

    try {
        if (toAdd.length) {
            await Promise.all(toAdd.map(fid =>
                fetch(`/api/favorites/${fid}/artworks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ artwork_ids: ids })
                })
            ));
        }
        if (toRemove.length) {
            await Promise.all(toRemove.map(fid =>
                fetch(`/api/favorites/${fid}/artworks/batch-remove`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ artwork_ids: ids })
                })
            ));
        }

        if (toAdd.length && toRemove.length) msg.textContent = '已更新收藏夹';
        else if (toAdd.length) msg.textContent = '收藏成功';
        else if (toRemove.length) msg.textContent = '已从收藏夹移除';
        else msg.textContent = '没有变化';

        msg.style.display = 'block';
        msg.style.color = '#4caf50';
        setTimeout(() => {
            closeFavSelect();
            ids.forEach(refreshTileFavState);
            if (!($('viewerOverlay').classList.contains('hidden')) && ids.length === 1) showViewer(ids[0]);
            if (currentView === 'gallery') updateBatchBar();
        }, 800);
    } catch (e) {
        msg.style.display = 'block';
        msg.textContent = '操作失败：' + e.message;
        msg.style.color = '#e94560';
    }
}

            <div>状态：<span>${data.pixiv_status === 'deleted' ? '已从 Pixiv 删除' : '活跃'}</span></div>
            <div>首次扫描：<span>${data.first_seen || '未知'}</span></div>
            <div>最后同步：<span>${data.last_synced || '未同步'}</span></div>
            ${data.sync_error ? `<div>同步状态：<span style="color:#e0575b;">上次同步失败：${escapeHtml(data.sync_error)}</span></div>` : ''}`;

        let tagsHtml = '';
        (data.tags || []).forEach(t => {
            tagsHtml += `<a onclick="closeViewerToTag('${escapeAttr(t.name)}')">#${escapeHtml(t.name)}</a>`;
        });
        $('vTags').innerHTML = tagsHtml;

        let favTagsHtml = '';
        (data.favorites || []).forEach(f => {
            favTagsHtml += `<a onclick="closeViewerToFavorite(${f.id}, '${escapeAttr(f.name)}')">${escapeHtml(f.name)}</a>`;
        });
        if (favTagsHtml) {
            $('vFav').style.display = 'flex';
            $('vFavTags').innerHTML = favTagsHtml;
        } else {
            $('vFav').style.display = 'none';
        }

function renderViewerImage() {
    const img = _viewer.data.images[_viewer.idx];
    if (!img) { $('vMainImage').style.display = 'none'; return; }
    $('vMainImage').src = paImg('/image/' + encodeURI(img.path));
    $('vMainImage').style.display = 'block';

    const total = _viewer.data.images.length;
    if (total > 1) {
        $('vNav').style.display = 'flex';
        $('vPageIndicator').textContent = `${_viewer.idx + 1} / ${total}`;
        $('vPrev').disabled = _viewer.idx <= 0;
        $('vNext').disabled = _viewer.idx >= total - 1;
    } else {
        $('vNav').style.display = 'none';
    }
}

function viewerNav(delta) {
    if (!_viewer.data) return;
    const total = _viewer.data.images.length;
    const next = _viewer.idx + delta;
    if (next < 0 || next >= total) return;
    _viewer.idx = next;
    renderViewerImage();
}

function openViewerFromAuthor(authorId, workIndex) {
    const ids = _authorWorksIds[authorId] || [];
    if (!ids.length) return;
    _navIds = ids;
    _navIndex = workIndex;
    _navCtx = { type: 'author', q: '', tag: '', author: '', sort: 'id', order: 'desc', page: 1 };
    showViewer(ids[workIndex]);
}

function updateArtNav() {
    const hasPrev = _navIndex > 0;
    const hasNext = _navIndex >= 0 && _navIndex < _navIds.length - 1;
    const artNavVisible = _navIds.length > 1;
    $('vPrevArt').style.display = (artNavVisible && hasPrev) ? '' : 'none';
    $('vNextArt').style.display = (artNavVisible && hasNext) ? '' : 'none';
}

async function viewerArtworkNav(delta) {
    if (!_navIds.length) return;
    let idx = _navIndex + delta;

    if (idx < 0) {
        const loaded = await loadAdjacentNavPage(-1);
        if (!loaded) return;
        idx = _navIndex + delta;
    } else if (idx >= _navIds.length) {
        const loaded = await loadAdjacentNavPage(1);
        if (!loaded) return;
        idx = _navIndex + delta;
    }

    if (idx < 0 || idx >= _navIds.length) return;
    _navIndex = idx;
    showViewer(_navIds[idx]);
}

async function loadAdjacentNavPage(direction) {
    const nextPage = _navCtx.page + direction;
    if (nextPage < 1) return false;
    try {
        const url = buildGalleryUrl(nextPage, _navCtx);
        const resp = await fetch(url);
        const data = await resp.json();
        const ids = (data.artworks || []).map(a => a.id);
        if (!ids.length) return false;
        if (direction > 0) {
            _navIds = _navIds.concat(ids);
        } else {
            _navIds = ids.concat(_navIds);
            _navIndex += ids.length;
        }
        _navCtx.page = nextPage;
        currentPage = nextPage;
        return true;
    } catch (e) {
        showToast('加载失败');
        return false;
    }
}

function hideViewer() {
    $('viewerOverlay').classList.add('hidden');
    document.body.style.overflow = '';
    _viewer = { data: null, idx: 0 };
    $('vMainImage').src = '';
}

        if (e.key === 'Escape') { hideViewer(); }

// ===== Background jobs: scan / sync（右下角进度悬浮窗，关闭=停止） =====
let _jobPollTimer = null;
let _jobCloseTimer = null;
let _currentJobId = null;

function setFabBusy(busy) {
    const scanBtn = $('btnScan');
    const syncBtn = $('btnSync');
    [scanBtn, syncBtn].forEach(b => {
        if (!b) return;
        b.disabled = busy;
        b.style.opacity = busy ? 0.55 : 1;
        b.style.cursor = busy ? 'not-allowed' : 'pointer';
    });
}

function showJobWindow() {
    $('jobWindow').classList.remove('hidden');
}

function hideJobWindow() {
    $('jobWindow').classList.add('hidden');
}

function startJob(kind) {
    clearTimeout(_jobCloseTimer);
    clearTimeout(_jobPollTimer);
    setFabBusy(true);
    $('jobTitle').textContent = kind === 'scan' ? '扫描图片' : '同步元数据';
    $('jobBody').style.display = 'block';
    $('jobResult').style.display = 'none';
    $('jobError').style.display = 'none';
    $('jobPhase').textContent = '正在启动…';
    $('jobPct').textContent = '';
    $('jobBarFill').style.width = '0%';
    showJobWindow();

    fetch(kind === 'scan' ? '/api/scan' : '/api/sync')
        .then(r => r.json())
        .then(d => {
            if (d && d.job_id) {
                _currentJobId = d.job_id;
                pollJob(d.job_id);
            } else {
                const err = (d && d.error) ? d.error : { message: '任务启动失败', code: 'UNKNOWN' };
                showJobError(err);
            }
        })
        .catch(e => {
            showJobError({ code: 'CONN', message: '无法连接服务器：' + e.message,
                           hint: '请确认服务仍在运行' });
        });
}

function pollJob(jobId) {
    clearTimeout(_jobPollTimer);
    fetch('/api/jobs/' + jobId)
        .then(r => r.json())
        .then(d => {
            if (d.status === 'running') {
                renderJobProgress(d);
                _jobPollTimer = setTimeout(() => pollJob(jobId), 500);
            } else {
                finishJob(d);
            }
        })
        .catch(() => {
            _jobPollTimer = setTimeout(() => pollJob(jobId), 1000);
        });
}

function renderJobProgress(d) {
    $('jobTitle').textContent = d.kind === 'scan' ? '扫描图片' : '同步元数据';
    $('jobPhase').textContent = d.message || '处理中…';
    const fill = $('jobBarFill');
    if (d.total != null && d.total > 0) {
        fill.classList.remove('indeterminate');
        const pct = Math.min(100, Math.round(((d.current || 0) / d.total) * 100));
        fill.style.width = pct + '%';
        $('jobPct').textContent = `${d.current || 0} / ${d.total}`;
    } else {
        fill.classList.add('indeterminate');
        fill.style.width = '40%';
        $('jobPct').textContent = '';
    }
}

function finishJob(d) {
    _currentJobId = null;
    setFabBusy(false);
    if (d.status === 'error') {
        showJobError(d.error || { message: '任务执行出错', code: 'INTERNAL' });
        return;
    }
    if (d.status === 'cancelled') {
        hideJobWindow();
        showToast('任务已停止');
        return;
    }
    renderJobResult(d);
    if (d.kind === 'scan') {
        const r = d.result || {};
        if (r.new_artworks > 0 || r.pruned_artworks > 0) loadGallery(1);
    } else if (d.kind === 'sync') {
        loadGallery(1);
        if ($('viewAuthors').classList.contains('active')) loadAuthorsView();
        if ($('viewTags').classList.contains('active')) loadTagsView();
    }
    clearTimeout(_jobCloseTimer);
    _jobCloseTimer = setTimeout(hideJobWindow, 3500);
}

function renderJobResult(d) {
    const r = d.result || {};
    let html = '';
    if (d.kind === 'scan') {
        html = `扫描完成<br>新作品 ${r.new_artworks || 0} · 新图片 ${r.new_images || 0} · 跳过 ${r.skipped || 0}`;
        if (r.duplicates || r.pruned_duplicates) {
            html += `<br>去重：本次跳过 ${r.duplicates || 0} · 清理存量重复 ${r.pruned_duplicates || 0}`;
        }
        if (r.pruned_artworks || r.pruned_images) {
            html += `<br>清理 ${r.pruned_artworks || 0} 作品 / ${r.pruned_images || 0} 图片（本地文件已不存在）`;
        }
        if (r.thumbnails) {
            html += `<br>缩略图：生成 ${r.thumbnails.generated || 0} · 失败 ${r.thumbnails.failed || 0}`;
        }
    } else {
        html = `同步完成<br>成功 ${r.synced || 0} · 已删除 ${r.deleted || 0} · 失败 ${r.failed || 0}`;
        const fails = (r.details || []).filter(x => x.status === 'failed').slice(0, 3);
        if (fails.length) {
            html += `<div class="job-err-line">失败示例：<br>${fails.map(f => `PID ${f.pixiv_id}：${escapeHtml(f.error)}`).join('<br>')}</div>`;
        }
        if (r.auth_error) {
            html += `<div class="job-err-line">认证错误：${escapeHtml(r.auth_error)}</div>`;
        }
        if (r.failed > 0) {
            html += `<div class="job-err-line">失败的作品将在下次同步时自动重试。</div>`;
        }
    }
    $('jobTitle').textContent = d.kind === 'scan' ? '扫描图片' : '同步元数据';
    $('jobBody').style.display = 'none';
    $('jobError').style.display = 'none';
    $('jobResult').style.display = 'block';
    $('jobResult').innerHTML = html;
}

function showJobError(err) {
    setFabBusy(false);
    $('jobTitle').textContent = '出错了';
    $('jobBody').style.display = 'none';
    $('jobResult').style.display = 'none';
    $('jobError').style.display = 'block';
    const code = escapeHtml(err.code || 'ERROR');
    const message = escapeHtml(err.message || '未知错误');
    const hint = err.hint ? `<div class="job-err-hint">${escapeHtml(err.hint)}</div>` : '';
    const detail = err.detail ? `<details class="job-err-detail"><summary>详细信息</summary><pre>${escapeHtml(err.detail)}</pre></details>` : '';
    $('jobError').innerHTML = `<div class="job-err-code">${code}</div><div>${message}</div>${hint}${detail}`;
    showJobWindow();
}

function closeJobWindow() {
    clearTimeout(_jobPollTimer);
    clearTimeout(_jobCloseTimer);
    if (_currentJobId) {
        fetch('/api/jobs/' + _currentJobId + '/cancel', { method: 'POST' }).catch(() => {});
        _currentJobId = null;
    }
    setFabBusy(false);
    hideJobWindow();
}

// ===== Toast =====
let _toastTimer = null;
function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('visible');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('visible'), 3500);
}

// ===== R18 显示模式 / 已删除快速筛选 / 设置分页 =====
let _r18Mode = 'all';
let deletedFilter = false;

function r18Param() {
    return _r18Mode === 'all' ? '' : _r18Mode;
}

function initR18() {
    try {
        const v = localStorage.getItem('pa-r18');
        if (v === 'hide' || v === 'only') _r18Mode = v;
    } catch (e) {}
    updateR18Btn();
}

function cycleR18() {
    _r18Mode = ({ all: 'hide', hide: 'only', only: 'all' })[_r18Mode] || 'all';
    try { localStorage.setItem('pa-r18', _r18Mode); } catch (e) {}
    updateR18Btn();
    if (currentView === 'authors') loadAuthorsView();
    else if (currentView === 'tags') loadTagsView();
    else if (currentView === 'favorites') loadFavoritesView();
    else loadGallery(1);
}

function updateR18Btn() {
    const labels = { all: 'R18：全部', hide: 'R18：隐藏', only: 'R18：仅R18' };
    const btn = $('btnR18');
    if (btn) btn.textContent = labels[_r18Mode] || 'R18：全部';
}

function toggleDeletedFilter() {
    deletedFilter = !deletedFilter;
    const btn = $('btnDeleted');
    if (btn) btn.classList.toggle('active', deletedFilter);
    if (deletedFilter) {
        setFilter('status', 'deleted', '已删除作品');
    } else {
        clearFilter();
    }
    if (currentView !== 'gallery') switchView('gallery');
    loadGallery(1);
}

function switchSettingsTab(name) {
    if ($('secBasic')) $('secBasic').style.display = name === 'basic' ? '' : 'none';
    if ($('secNetwork')) $('secNetwork').style.display = name === 'network' ? '' : 'none';
    if ($('tabBasic')) $('tabBasic').classList.toggle('active', name === 'basic');
    if ($('tabNetwork')) $('tabNetwork').classList.toggle('active', name === 'network');
}

// ===== Theme =====
function toggleTheme() {
    const root = document.documentElement;
    const isLight = root.getAttribute('data-theme') === 'light';
    root.setAttribute('data-theme', isLight ? '' : 'light');
    try { localStorage.setItem('pa-theme', isLight ? 'dark' : 'light'); } catch (e) {}
    updateThemeBtn();
}

function updateThemeBtn() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const btn = $('btnTheme');
    if (btn) {
        btn.textContent = isLight ? '🌙' : '☀️';
        btn.title = isLight ? '切换到暗色主题' : '切换到亮色主题';
    }
}

// ===== Safe mode =====
function setSafeMode(on) {
    document.documentElement.classList.toggle('safe-mode', on);
    try { localStorage.setItem('pa-safe', on ? '1' : '0'); } catch (e) {}
    updateSafeBadge();
}

function updateSafeBadge() {
    const on = document.documentElement.classList.contains('safe-mode');
    const badge = $('safeBadge');
    if (badge) badge.style.display = on ? 'inline-block' : 'none';
}

function openExternalBrowser() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.open_external(window.location.origin).then(function () {
            showToast('已用外部浏览器打开');
        });
    } else {
        window.open(window.location.origin, '_blank');
    }
}

// ===== Settings =====
async function openSettings() {
    $('settingsOverlay').classList.remove('hidden');
    $('settingsMsg').style.display = 'none';
    $('settingSafeMode').checked = document.documentElement.classList.contains('safe-mode');
    try {
        const resp = await fetch('/api/settings');
        const data = await resp.json();
        $('tokenHint').textContent = data.has_token ? `当前: ${data.token_preview}` : '未设置';
        $('dirHint').textContent = data.image_source_dir ? `当前: ${data.image_source_dir}` : '未设置';
        $('proxyHint').textContent = data.proxy ? `当前: ${data.proxy}` : '未设置';
        $('modeHint').textContent = data.connection_mode === 'direct' ? '直连模式：无需代理' : (data.connection_mode === 'proxy' ? '代理模式：使用下方代理地址' : '自动模式：直连失败自动回退代理');
        $('portHint').textContent = data.server_port ? `当前端口: ${data.server_port}（修改后需重启服务生效，默认 6814）` : '当前端口: 6814（修改后需重启服务生效）';
        $('tokenHint2').textContent = data.access_token_auto ? '局域网模式下自动生成，无固定令牌' : (data.access_token ? '当前使用固定令牌' : '未设置（非局域网模式无需令牌）');
        $('settingToken').value = '';
        $('settingDir').value = data.image_source_dir || '';
        $('settingProxy').value = data.proxy || '';
        $('settingMode').value = data.connection_mode || 'auto';
        $('settingPort').value = data.server_port || '';
        $('settingAccessToken').value = data.access_token_auto ? '' : (data.access_token || '');
    } catch (e) {
        $('tokenHint').textContent = '无法加载';
    }
}

function closeSettings() {
    $('settingsOverlay').classList.add('hidden');
}

async function refreshDirectIps() {
    const hint = $('refreshIpHint');
    hint.textContent = '正在通过 DoH 查询最新 IP...';
    try {
        const resp = await fetch('/api/settings/refresh-ips', { method: 'POST' });
        const data = await resp.json();
        const updated = data.updated || {};
        const count = Object.keys(updated).length;
        if (count > 0) {
            hint.textContent = `已更新 ${count} 个 IP：` + Object.entries(updated).map(([k, v]) => `${k.replace('PIXIV_IP_', '')}=${v}`).join('，');
        } else {
            hint.textContent = '未获取到新 IP（DoH 可能被网络阻断），可手动在 .env 中设置 PIXIV_IP_*';
        }
    } catch (e) {
        hint.textContent = '刷新失败：' + e.message;
    }
}

async function saveSettings() {
    const token = $('settingToken').value.trim();
    const dir = $('settingDir').value.trim();
    const proxy = $('settingProxy').value.trim();
    const mode = $('settingMode').value;
    const port = $('settingPort').value.trim();
    const accessToken = $('settingAccessToken').value.trim();
    const msg = $('settingsMsg');

    const payload = {
        refresh_token: token,
        image_source_dir: dir,
        proxy: proxy,
        connection_mode: mode
    };
    if (port) payload.server_port = port;
    payload.access_token = accessToken;

    if (!token && !dir && !proxy && !port && !accessToken) {
        msg.style.display = 'block';
        msg.textContent = '请至少填写一项';
        msg.style.color = '#e94560';
        return;
    }
    try {
        const resp = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (data.error) {
            msg.style.display = 'block';
            msg.textContent = (data.error.hint || data.error.message || '保存失败');
            msg.style.color = '#e94560';
            return;
        }
        if (data.status === 'ok') {
            msg.style.display = 'block';
            msg.textContent = '保存成功' + (port ? '（端口修改需重启服务生效）' : '');
            msg.style.color = '#4caf50';
            setTimeout(closeSettings, 1200);
        }
    } catch (e) {
        msg.style.display = 'block';
        msg.textContent = '保存失败: ' + e.message;
        msg.style.color = '#e94560';
    }
}

// ===== Helpers =====
function escapeHtml(text) {
    if (text == null) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const SAFE_TAGS = new Set(['A', 'B', 'I', 'U', 'STRONG', 'EM', 'P', 'BR', 'SPAN', 'DIV', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'CODE', 'PRE']);

function sanitizeHtml(html) {
    const template = document.createElement('template');
    template.innerHTML = String(html || '');

    const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
    const toRemove = [];
    while (walker.nextNode()) {
        const el = walker.currentNode;
        if (!SAFE_TAGS.has(el.tagName)) {
            toRemove.push(el);
            continue;
        }
        for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name === 'href' && /^https?:/i.test(attr.value)) continue;
            if (name === 'target') { el.target = '_blank'; continue; }
            if (name === 'rel') continue;
            el.removeAttribute(attr.name);
        }
        if (el.tagName === 'A') {
            el.setAttribute('target', '_blank');
            el.setAttribute('rel', 'noopener noreferrer');
        }
    }
    for (const el of toRemove) {
        el.replaceWith(document.createTextNode(el.textContent || ''));
    }
    return template.innerHTML;
}

// Debounced search
$('searchInput').addEventListener('input', function () {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(doSearch, 350);
});
$('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
        clearTimeout(_searchTimer);
        doSearch();
    }
});

updateThemeBtn();
updateSafeBadge();
initR18();
if (window.pywebview && window.pywebview.api) {
    const f = $('openExternalField');
    if (f) f.style.display = 'block';
}
loadGallery(1);
