name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]       # 当 main 分支有推送时触发
  pull_request:
    branches: [ "main" ]       # 可选：PR 时也构建但不推送

env:
  REGISTRY: docker.io          # 或 ghcr.io（GitHub Container Registry）
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pixiv-archive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # file: ./Dockerfile          # 如果 Dockerfile 在根目录，则省略此行
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
